<!DOCTYPE html>
<html lang="es-PE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#2dd36f" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sumaq Allpa" />
    <meta name="description" content="Sistema de Gestión para Lodge Casa Sumaq Allpa - Reservas, Recepción, POS y más." />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Casa Sumaq Allpa - Sistema de Gestión</title>
    <style>
      /* CSS CRÍTICO inline: forzar visibilidad del root */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #fff; }
      #root {
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        position: relative !important;
        z-index: 1 !important;
      }
    </style>
    <script>
      (function () {
        try {
          if ('serviceWorker' in navigator) {
            var killSW = function () {
              try {
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  var killed = 0;
                  regs.forEach(function (r) {
                    try { r.unregister(); } catch (_) {}
                    killed++;
                  });
                  if (killed > 0 && window.console) {
                    console.log('[SW Cleanup] Se desactivaron ' + killed + ' service workers antiguos. Refrescando...');
                  }
                }).catch(function () {});
              } catch (_) {}
              if ('caches' in window) {
                try {
                  caches.keys().then(function (keys) {
                    return Promise.all(keys.map(function (k) {
                      try { return caches.delete(k); } catch (_) { return Promise.resolve(false); }
                    }));
                  }).then(function () {
                    if (window.sessionStorage) {
                      var alreadyReloaded = window.sessionStorage.getItem('__sw_reloaded__');
                      if (!alreadyReloaded) {
                        window.sessionStorage.setItem('__sw_reloaded__', '1');
                        try { window.location.reload(true); } catch (_) { window.location.reload(); }
                      }
                    }
                  }).catch(function () {});
                } catch (_) {}
              }
            };
            killSW();
            try {
              navigator.serviceWorker.addEventListener('controllerchange', function () {
                if (window.sessionStorage) {
                  var alreadyReloaded = window.sessionStorage.getItem('__sw_reloaded__');
                  if (!alreadyReloaded) {
                    window.sessionStorage.setItem('__sw_reloaded__', '1');
                    try { window.location.reload(true); } catch (_) { window.location.reload(); }
                  }
                }
              });
            } catch (_) {}
          }
          if (window.performance && performance.navigation && performance.navigation.type === 1) {
            window.sessionStorage && window.sessionStorage.setItem('__no_sw_loop__', '1');
          }
        } catch (e) {}
        var href = window.location.href;
        var ghPagesBase = '/casasumaqallpa/';
        var host = window.location.hostname;
        try {
          var usp = new URLSearchParams(window.location.search);
          var pRestored = usp.get('p');
          if (pRestored) {
            usp.delete('p');
            var qRestored = usp.get('q');
            usp.delete('q');
            var restoredPath = pRestored.indexOf('/') === 0 ? pRestored : '/' + pRestored;
            var restoredSearch = qRestored ? '?' + qRestored.replace(/~and~/g, '&') : (usp.toString() ? '?' + usp.toString() : '');
            var restoredHash = window.location.hash;
            var target = ghPagesBase + (restoredPath[0] === '/' ? restoredPath.slice(1) : restoredPath) + restoredSearch + restoredHash;
            window.sessionStorage && window.sessionStorage.setItem('__spa_restored__', '1');
            if (window.history && typeof window.history.replaceState === 'function') {
              window.history.replaceState(null, document.title || '', target);
            } else {
              window.location.replace(target);
            }
          }
        } catch (e) {}
        if ((host === 'moisesohs1007.github.io' || host.indexOf('github.io') !== -1) && href.indexOf(ghPagesBase) === -1 && href.indexOf('404') === -1) {
          var rest = window.location.pathname === '/' ? '' : window.location.pathname;
          window.location.replace('/casasumaqallpa/' + (rest[0] === '/' ? rest.slice(1) : rest) + window.location.search + window.location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Limpieza única de overlays residuales de Ionic (solo al cargar la página).
      // NO usar intervalos ni MutationObserver: eliminar overlays dinámicos rompe
      // el ciclo de vida de Ionic (present/dismiss) y causa "framework delegate is missing".
      (function () {
        var SELECTORES = 'ion-overlay, ion-modal, ion-alert, ion-toast, ion-popover, ion-action-sheet, ion-loading, ion-picker, ion-backdrop, .backdrop-no-scroll';
        try {
          var els = document.querySelectorAll(SELECTORES);
          els.forEach(function (el) {
            try {
              if (el && el.parentNode) el.parentNode.removeChild(el);
              else if (el && el.remove) el.remove();
            } catch (_) {}
          });
          var bodyStyle = document.body.getAttribute('style') || '';
          if (bodyStyle.indexOf('overflow') !== -1) {
            document.body.style.overflow = '';
          }
        } catch (_) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
