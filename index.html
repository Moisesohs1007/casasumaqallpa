<!DOCTYPE html>
<html lang="es-PE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#2dd36f" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sumaq Allpa" />
    <meta name="description" content="Sistema de Gestión para Lodge Casa Sumaq Allpa - Reservas, Recepción, POS y más." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Casa Sumaq Allpa - Sistema de Gestión</title>
    <script>
      (function () {
        function cleanupThenContinue() {
            if (!('serviceWorker' in navigator)) return Promise.resolve(false);
            return navigator.serviceWorker.getRegistrations()
              .then(function (registrations) {
                var pending = registrations.map(function (reg) { return reg.unregister(); });
                if ('caches' in window) {
                  pending.push(window.caches.keys().then(function (keys) {
                    return Promise.all(keys.map(function (k) { return window.caches.delete(k); }));
                  }));
                }
                return Promise.all(pending).then(function () { return registrations.length > 0 || ('caches' in window); });
              });
        }
        var needsRedirect = location.pathname.indexOf('/casasumaqallpa') !== 0;
        if (needsRedirect) {
          cleanupThenContinue().finally(function () {
            var newPath = '/casasumaqallpa/' + (location.hash || '');
            location.replace(newPath);
          });
        } else {
          // Ruta ya correcta: limpia SW/caches y reload SOLO 1 vez al iniciar (flag #limpio para no loop)
          try {
            if (sessionStorage.getItem('csq_sw_cleaned') !== '1') {
              cleanupThenContinue().then(function (didClean) {
                sessionStorage.setItem('csq_sw_cleaned', '1');
                if (didClean) location.reload();
              });
            }
          } catch (e) {}
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
