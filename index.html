<!DOCTYPE html>
<html lang="es-PE">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#2dd36f" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sumaq Allpa" />
    <meta name="description" content="Sistema de Gestión para Lodge Casa Sumaq Allpa - Reservas, Recepción, POS y más." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Casa Sumaq Allpa - Sistema de Gestión</title>
    <script>
      (function () {
        // ============================================================
        // 1) REDIRECCIÓN FORZADA: si no estamos dentro de /casasumaqallpa/ 
        //    (por ej: usuario abrió user.io/reservas sin subpath) → HOME
        // ============================================================
        try {
          var pathname = window.location.pathname || '';
          // Normalizar: quitar trailing / al final y agregar / inicial
          var startsOk = pathname === '/casasumaqallpa'
            || pathname.indexOf('/casasumaqallpa/') === 0
            || pathname === '/casasumaqallpa/index.html'
            || pathname.indexOf('/casasumaqallpa/index.html') === 0;
          if (!startsOk) {
            // Limpiar SW + cache por seguridad
            var cleanup = function () {
              if (!('serviceWorker' in navigator)) return Promise.resolve();
              return navigator.serviceWorker.getRegistrations().then(function (regs) {
                var pending = regs.map(function (r) { return r.unregister(); });
                if ('caches' in window) {
                  pending.push(window.caches.keys().then(function (keys) {
                    return Promise.all(keys.map(function (k) { return window.caches.delete(k); }));
                  }));
                }
                return Promise.all(pending);
              });
            };
            cleanup().then(function () {
              window.location.replace('/casasumaqallpa/');
            });
            return; // no seguir ejecutando
          }
        } catch (e) { /* no-op */ }

        // ============================================================
        // 2) GITHUB PAGES SPA FALLBACK: lee ?p=/ruta generado por 404.html
        //    y RESTAURA el path REAL ANTES que Ionic Router arranque.
        // ============================================================
        try {
          var q = new URLSearchParams(window.location.search);
          var p = q.get('p');
          if (p) {
            p = decodeURIComponent(p.replace(/~and~/g, '&'));
            q.delete('p');
            var qExtra = q.get('q');
            if (qExtra) {
              try {
                var extraQs = new URLSearchParams(qExtra.replace(/~and~/g, '&'));
                extraQs.forEach(function (v, k) { q.set(k, v); });
              } catch (_) { /* ignore */ }
              q.delete('q');
            }
            var qs = q.toString();
            var restoredPath = (p.charAt(0) === '/' ? '' : '/') + p + (qs ? '?' + qs : '') + (window.location.hash || '');
            if (restoredPath !== '/' && restoredPath !== '') {
              window.history.replaceState(null, document.title, '/casasumaqallpa' + restoredPath);
            } else {
              window.history.replaceState(null, document.title, '/casasumaqallpa/');
            }
          }
        } catch (e) { /* no-op */ }

        // ============================================================
        // 3) CLEANUP SW y CACHÉES ANTIGUAS PARA SIEMPRE:
        //    Antiguo selfDestroying + VitePWA dejaba caché corrupto.
        // ============================================================
        try {
          if (sessionStorage.getItem('csq_sw_cleaned_v2') !== '1') {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                var didAny = regs.length > 0;
                var pending = regs.map(function (r) { return r.unregister(); });
                if ('caches' in window) {
                  pending.push(window.caches.keys().then(function (keys) {
                    if (keys && keys.length) didAny = true;
                    return Promise.all(keys.map(function (k) { return window.caches.delete(k); }));
                  }));
                }
                Promise.all(pending).then(function () {
                  sessionStorage.setItem('csq_sw_cleaned_v2', '1');
                  if (didAny) window.location.reload();
                });
              });
            } else {
              sessionStorage.setItem('csq_sw_cleaned_v2', '1');
            }
          }
        } catch (e) { /* no-op */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family: Arial, sans-serif; padding: 32px; max-width: 560px; margin: 0 auto;">
        <h2 style="color:#2dd36f">Casa Sumaq Allpa</h2>
        <p>Este sistema requiere JavaScript habilitado para funcionar. Por favor activa JavaScript en tu navegador y recarga la página.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
